name: sonic_wave
description: "SonicWave — A modern, beautiful music streaming app"
publish_to: 'none'
version: 1.2.12+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Audio & Playback
  just_audio: ^0.9.43
  audio_service: ^0.18.17
  audio_session: ^0.1.25
  rxdart: ^0.28.0

  # YouTube Data
  youtube_explode_dart: ^3.1.0
  extractor: ^1.0.0

  # State Management
  provider: ^6.1.4

  # UI & Design
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Storage
  shared_preferences: ^2.3.4
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  flutter_cache_manager: ^3.4.1
  permission_handler: ^11.3.1
  uuid: ^4.5.1
  audio_metadata_reader: ^1.6.0
  dynamic_color: ^1.8.1
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#0D0D1A"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true
