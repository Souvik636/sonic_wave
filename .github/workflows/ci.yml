name: CI

# Continuous integration for SonicWave.
# Runs static analysis, tests, and a debug build sanity check on every
# push to main branches and on every pull request.
#
# VERSION SYNC — Single source of truth: pubspec.yaml
# ─────────────────────────────────────────────────────────────────────────────
# The "Sync & verify version" step below regenerates lib/constants/app_version.dart
# from pubspec.yaml via `dart run tool/sync_version.dart`, then fails CI if the
# committed file does not already match.
#
# To bump the version locally:
#   dart run tool/bump_version.dart patch   # or minor / major / set X.Y.Z
# This updates pubspec.yaml AND app_version.dart in one command.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

# Cancel in-progress runs for the same ref (e.g. new push to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin to a stable channel. To lock an exact version, set e.g. FLUTTER_VERSION: "3.38.0"
  # and add `flutter-version: ${{ env.FLUTTER_VERSION }}` to the setup step below.
  FLUTTER_CHANNEL: stable
  JAVA_VERSION: "17"

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Print versions
        run: |
          flutter --version
          dart --version

      - name: Install dependencies
        run: flutter pub get

      - name: Sync & verify version
        run: |
          dart run tool/sync_version.dart
          git diff --exit-code lib/constants/app_version.dart || (
            echo ""
            echo "ERROR: lib/constants/app_version.dart is out of sync with pubspec.yaml."
            echo "Run 'dart run tool/sync_version.dart' locally and commit the result."
            exit 1
          )

      - name: Verify formatting
        run: dart format --output=none .

      - name: Analyze
        run: flutter analyze

      - name: Run tests with coverage
        run: |
          if [ -d "test" ]; then
            flutter test --coverage --reporter expanded
          else
            echo "No test directory found, skipping tests."
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-android-debug:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: |
          for i in 1 2 3; do
            echo "Attempt $i: Building APK..."
            flutter build apk --debug && break || {
              if [ $i -eq 3 ]; then exit 1; fi
              echo "Build failed. Retrying in 10s..."
              sleep 10
            }
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
