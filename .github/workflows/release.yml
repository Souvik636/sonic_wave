name: Release

# Builds and publishes signed Android artifacts when a version tag is pushed.
#
# Trigger:  git tag v1.2.3 && git push origin v1.2.3
#
# The tag name (without the leading "v") becomes the app version name, and the
# workflow run number becomes the build/version code.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64  - base64 of your upload keystore (.jks)
#                              e.g.  base64 -w0 upload-keystore.jks   (Linux)
#                                    base64 -i  upload-keystore.jks   (macOS)
#   ANDROID_KEYSTORE_PASSWORD - store password
#   ANDROID_KEY_ALIAS         - key alias
#   ANDROID_KEY_PASSWORD      - key password
#   GEMINI_KEYS              - comma-separated Gemini API keys for AI features
# See docs/CICD.md for full setup instructions.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version name (e.g. 1.2.3). Defaults to pubspec value when empty."
        required: false
        default: ""

permissions:
  contents: write # needed to create the GitHub Release

env:
  FLUTTER_CHANNEL: stable
  JAVA_VERSION: "17"

jobs:
  release:
    name: Build & Publish Android Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Derive version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)"
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION (+${{ github.run_number }})"

      - name: Decode or configure release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            printf "storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" "${{ secrets.ANDROID_KEY_ALIAS }}" "${{ secrets.ANDROID_KEY_PASSWORD }}" > android/key.properties
            echo "Keystore decoded successfully from GitHub Secrets."
          elif [ -f "android/app/ci-release-keystore.jks" ]; then
            printf "storeFile=ci-release-keystore.jks\nstorePassword=sonicwave123\nkeyAlias=upload\nkeyPassword=sonicwave123\n" > android/key.properties
            echo "Configured release signing using repository CI release keystore."
          else
            echo "::error::No signing keystore found."
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build App Bundle (AAB)
        env:
          SONICWAVE_REQUIRE_RELEASE_SIGNING: "1"
        run: >
          flutter build appbundle --release
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ steps.version.outputs.code }}
          --dart-define=GEMINI_KEYS=${{ secrets.GEMINI_KEYS }}

      - name: Build Android ARM64 Release APK
        env:
          SONICWAVE_REQUIRE_RELEASE_SIGNING: "1"
        run: >
          flutter build apk --release --target-platform=android-arm64
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ steps.version.outputs.code }}
          --dart-define=GEMINI_KEYS=${{ secrets.GEMINI_KEYS }}

      - name: Verify APK is not debug-signed
        # Last line of defence: assert the published binary carries the upload
        # certificate and not "CN=Android Debug". A debug-signed release is
        # un-installable over an existing install, and that is invisible until a
        # user tries to update.
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          SIGNER_TOOL=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -n1)
          if [ -z "$SIGNER_TOOL" ]; then
            echo "::error::apksigner not found; cannot verify release signature."
            exit 1
          fi
          echo "Using $SIGNER_TOOL"
          CERTS=$("$SIGNER_TOOL" verify --print-certs "$APK")
          echo "$CERTS"
          if echo "$CERTS" | grep -q "CN=Android Debug"; then
            echo "::error::app-release.apk is DEBUG-signed. Refusing to publish."
            exit 1
          fi
          echo "Release signature verified."

      - name: Generate SHA-256 checksum
        # The updater's verifyChecksum() is a no-op unless the release carries a
        # .sha256 asset, which means a truncated or corrupted download would
        # previously sail through to the installer and fail there.
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-release.apk > app-release.apk.sha256
          cat app-release.apk.sha256

      - name: Clean up signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sonicwave-${{ steps.version.outputs.name }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/flutter-apk/*.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          TITLE="SonicWave ${{ steps.version.outputs.name }}"
          
          echo "Checking release status for $TAG..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — updating release assets..."
            gh release upload "$TAG" \
              build/app/outputs/bundle/release/app-release.aab \
              build/app/outputs/flutter-apk/*.apk \
              build/app/outputs/flutter-apk/*.sha256 \
              --clobber
          else
            echo "Creating new GitHub Release $TAG..."
            gh release create "$TAG" \
              build/app/outputs/bundle/release/app-release.aab \
              build/app/outputs/flutter-apk/*.apk \
              build/app/outputs/flutter-apk/*.sha256 \
              --title "$TITLE" \
              --generate-notes
          fi
          echo "GitHub Release published successfully!"
