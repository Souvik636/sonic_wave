name: Release

# Builds and publishes signed Android artifacts when a version tag is pushed.
#
# Trigger:  git tag v1.2.3 && git push origin v1.2.3
#
# The tag name (without the leading "v") becomes the app version name, and the
# workflow run number becomes the build/version code.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64  - base64 of your upload keystore (.jks)
#                              e.g.  base64 -w0 upload-keystore.jks   (Linux)
#                                    base64 -i  upload-keystore.jks   (macOS)
#   ANDROID_KEYSTORE_PASSWORD - store password
#   ANDROID_KEY_ALIAS         - key alias
#   ANDROID_KEY_PASSWORD      - key password
# See docs/CICD.md for full setup instructions.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version name (e.g. 1.2.3). Defaults to pubspec value when empty."
        required: false
        default: ""

permissions:
  contents: write # needed to create the GitHub Release

env:
  FLUTTER_CHANNEL: stable
  JAVA_VERSION: "17"

jobs:
  release:
    name: Build & Publish Android Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Derive version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)"
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION (+${{ github.run_number }})"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
            storeFile=upload-keystore.jks
            storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
            keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
            keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
            EOF
            echo "Keystore decoded successfully."
          else
            echo "ANDROID_KEYSTORE_BASE64 secret not set. Building with fallback signing."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build App Bundle (AAB)
        run: >
          flutter build appbundle --release
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ steps.version.outputs.code }}

      - name: Build Android ARM64 Release APK
        run: >
          flutter build apk --release --target-platform=android-arm64
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ steps.version.outputs.code }}

      - name: Clean up signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sonicwave-${{ steps.version.outputs.name }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: SonicWave ${{ steps.version.outputs.name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/*.apk
